[package]
name = "rp-overlay-wlr"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "wlr-layer-shell overlay helper for the rp desktop app (GTK3 + gtk-layer-shell + WebKitGTK)"
license = "MIT"
publish = false

[[bin]]
name = "rp-overlay-wlr"
path = "src/main.rs"

[dependencies]
# GTK3 stack (system: gtk+-3.0 >= 3.24)
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
cairo-rs = "0.18"
# wlr-layer-shell integration (system: gtk-layer-shell-0 >= 0.6)
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# WebKitGTK (system: webkit2gtk-4.1 >= 2.40)
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# JSC value access for script messages (version pinned by webkit2gtk)
javascriptcore-rs = "=1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
debug = false
strip = true
lto = "thin"
codegen-units = 4
