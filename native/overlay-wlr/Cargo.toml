[package]
name = "rp-overlay-wlr"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "wlr-layer-shell overlay helper for the rp desktop app (GTK3 + gtk-layer-shell + WebKitGTK)"
license = "MIT"
publish = false

[[bin]]
name = "rp-overlay-wlr"
path = "src/main.rs"

[dependencies]
# GTK3 stack (system: gtk+-3.0 >= 3.24)
gtk = "0.19"
gdk = "0.19"
glib = "0.22"
cairo-rs = "0.22"
# WebKitGTK (system: webkit2gtk-4.1 >= 2.40)
webkit2gtk = { version = "3.0", features = ["v2_40"] }
# JSC value access for script messages (version matching webkit2gtk 3)
javascriptcore-rs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Links the system gtk-layer-shell-0 >= 0.6 C library directly (the crates.io
# gtk-layer-shell crate is unmaintained and pinned to glib 0.18).
pkg-config = "0.3"

[profile.release]
opt-level = 2
debug = false
strip = true
lto = "thin"
codegen-units = 4
