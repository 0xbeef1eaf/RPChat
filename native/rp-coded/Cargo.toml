[package]
name = "rp-coded"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Root daemon for the rp desktop app: input lock (EVIOCGRAB) and uinput injection behind a root-owned policy file"
license = "MIT"
publish = false

[[bin]]
name = "rp-coded"
path = "src/main.rs"

[dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["signal", "fs", "user", "socket", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
debug = false
strip = true
lto = "thin"
codegen-units = 4
