<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page unavailable</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { text-align: center; max-width: 36rem; padding: 2rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.6rem; }
      p { margin: 0.3rem 0; }
      .hint { opacity: 0.7; font-size: 0.92em; margin-top: 1rem; }
      code { font-family: ui-monospace, monospace; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>This page is unavailable right now</h1>
      <p id="reason">Blocked by a character in rp-code.</p>
      <p id="why" hidden></p>
      <p id="patterns"><code></code></p>
      <p class="hint">Ask in rp-code if you need it back sooner — the character (or Settings → Browser → Clear all blocks) can lift it.</p>
    </main>
    <script src="blocked.js" type="module"></script>
  </body>
</html>
