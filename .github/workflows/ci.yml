name: CI

# Pull requests get one run, not two: a branch push and its PR used to fire this
# workflow separately for the same commit. `main` runs it as well so the caches
# below are written on the default branch — GitHub only lets a branch restore
# caches from itself or from the default branch, so without this every PR
# started cold and recompiled the Rust helper from scratch.
on:
  push:
    branches: [main]
  pull_request:

# Only ever reads the repository: nothing here needs a writable token, and saying so
# explicitly means the job keeps working whatever the repository default becomes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Shared with the release workflow: without a shared key the cache key
          # carries the job id, so the two workflows could never reuse each
          # other's artifacts for the same crates.
          shared-key: native-linux
          workspaces: |
            native/overlay-wlr
            native/rpchatd
      - name: Install system packages (helper build, Xvfb and nested Sway for smoke tests, apparmor_parser for the guard profiles)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev pkg-config \
            xvfb x11-apps xdotool imagemagick sway grim apparmor
      - run: pnpm install --frozen-lockfile
      - name: Build packages and app (compiles and bundles the native helper)
        run: pnpm build
        env:
          RP_REQUIRE_NATIVE: '1'
      - run: pnpm typecheck
      - run: pnpm test
      - name: Helper unit tests
        run: cargo test --manifest-path native/overlay-wlr/Cargo.toml
      - name: Daemon unit tests and lint
        run: |
          cargo test --manifest-path native/rpchatd/Cargo.toml
          cargo clippy --manifest-path native/rpchatd/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path native/rpchatd/Cargo.toml --check
          native/rpchatd/target/release/rpchatd --check-devices || true
      - name: Installer smoke (install.sh against a scratch prefix, fake AppImage)
        run: sudo scripts/install-smoke.sh "$RUNNER_TEMP/install-smoke"
      - name: Headful smoke (Xvfb, mock LLM, pixel checks)
        run: scripts/headful-smoke.sh "$RUNNER_TEMP/headful"
      - name: Browser extension smoke (Xvfb, Chromium with the unpacked extension)
        run: |
          pnpm --filter @rp/desktop exec playwright-core install chromium
          scripts/browser-smoke.sh "$RUNNER_TEMP/browser"
      - name: Layer-shell smoke (nested Sway, native helper)
        run: scripts/wlr-smoke.sh "$RUNNER_TEMP/wlr"
      - name: Package (unpacked) and smoke the packaged app
        run: |
          pnpm --filter @rp/desktop exec electron-builder --linux dir --publish never
          RP_APP_BIN=apps/desktop/release/linux-unpacked/rpchat scripts/headful-smoke.sh "$RUNNER_TEMP/packaged"
      - name: Upload smoke screenshots
        if: always()
        continue-on-error: true # diagnostics only; an artifact-storage quota must not fail CI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-screenshots
          path: |
            ${{ runner.temp }}/headful/*.png
            ${{ runner.temp }}/wlr/*.png
            ${{ runner.temp }}/packaged/*.png
          if-no-files-found: ignore
          retention-days: 3
