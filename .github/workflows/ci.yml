name: CI

# Pull requests get one run, not two: a branch push and its PR used to fire this
# workflow separately for the same commit. `main` runs it as well so the caches
# below are written on the default branch — GitHub only lets a branch restore
# caches from itself or from the default branch, so without this every PR
# started cold and recompiled the Rust helper from scratch.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the release workflow: without a shared key the cache key
          # carries the job id, so the two workflows could never reuse each
          # other's artifacts for the same crates.
          shared-key: native-linux
          workspaces: |
            native/overlay-wlr
            native/rp-coded
      - name: Install system packages (helper build, Xvfb and nested Sway for smoke tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev pkg-config \
            xvfb x11-apps xdotool imagemagick sway grim
      - run: pnpm install --frozen-lockfile
      - name: Build packages and app (compiles and bundles the native helper)
        run: pnpm build
        env:
          RP_REQUIRE_NATIVE: '1'
      - run: pnpm typecheck
      - run: pnpm test
      - name: Helper unit tests
        run: cargo test --manifest-path native/overlay-wlr/Cargo.toml
      - name: Daemon unit tests and lint
        run: |
          cargo test --manifest-path native/rp-coded/Cargo.toml
          cargo clippy --manifest-path native/rp-coded/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path native/rp-coded/Cargo.toml --check
          native/rp-coded/target/release/rp-coded --check-devices || true
      - name: Installer smoke (install.sh against a scratch prefix, fake AppImage)
        run: sudo scripts/install-smoke.sh "$RUNNER_TEMP/install-smoke"
      - name: Headful smoke (Xvfb, mock LLM, pixel checks)
        run: scripts/headful-smoke.sh "$RUNNER_TEMP/headful"
      - name: Browser extension smoke (Xvfb, Chromium with the unpacked extension)
        run: |
          pnpm --filter @rp/desktop exec playwright-core install chromium
          scripts/browser-smoke.sh "$RUNNER_TEMP/browser"
      - name: Layer-shell smoke (nested Sway, native helper)
        run: scripts/wlr-smoke.sh "$RUNNER_TEMP/wlr"
      - name: Package (unpacked) and smoke the packaged app
        run: |
          pnpm --filter @rp/desktop exec electron-builder --linux dir --publish never
          RP_APP_BIN=apps/desktop/release/linux-unpacked/rp-code scripts/headful-smoke.sh "$RUNNER_TEMP/packaged"
      - name: Upload smoke screenshots
        if: always()
        continue-on-error: true # diagnostics only; an artifact-storage quota must not fail CI
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: |
            ${{ runner.temp }}/headful/*.png
            ${{ runner.temp }}/wlr/*.png
            ${{ runner.temp }}/packaged/*.png
          if-no-files-found: ignore
          retention-days: 3
