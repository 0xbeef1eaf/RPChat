name: Release

# Every push to main becomes a tagged release: v<major>.<minor>.<N> where major.minor come from the
# root package.json and N is the number of commits on main, so versions are monotonic and need no
# version-bump commits. Linux installers (AppImage and deb, with the native layer-shell helper)
# are attached with generated release notes. Windows and macOS builds are intentionally not
# produced for now; re-add matrix entries here when they are wanted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          base="$(node -p "require('./package.json').version")"
          mm="${base%.*}"
          n="$(git rev-list --count HEAD)"
          version="${mm}.${n}"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Tag $tag already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $tag"
          fi

  build:
    name: Build (linux)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/overlay-wlr
      - name: Install system packages (native helper build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        run: |
          cd apps/desktop
          npm pkg set version="${{ needs.version.outputs.version }}"
      - name: Build
        run: pnpm build
        env:
          RP_REQUIRE_NATIVE: '1'
      - run: pnpm test
      - name: Package
        run: pnpm --filter @rp/desktop exec electron-builder --publish never
      - name: Collect artifacts
        run: |
          mkdir -p dist-out
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist-out/ \;
          ls -la dist-out
      - uses: actions/upload-artifact@v7
        with:
          name: installers-linux
          path: dist-out/*
          if-no-files-found: error

  release:
    name: Tag and publish
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create tag and release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: rp-code ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: installers/*
          body: |
            Automated release of `${{ github.sha }}` from `main`.

            - **Linux**: AppImage or `.deb` (the wlr-layer-shell overlay helper for Hyprland/Sway is bundled; it needs `gtk3`, `gtk-layer-shell` and `webkit2gtk-4.1` runtime libraries).
            - Windows and macOS builds are not produced yet.
