name: Release

# Every push to main whose CI passed becomes a tagged release: v<major>.<minor>.<N> where
# major.minor come from the root package.json and N is the number of commits on main, so versions
# are monotonic and need no version-bump commits. Linux installers (AppImage and deb, with the native layer-shell helper)
# are attached with generated release notes straight from the build job (no Actions artifacts, so
# the artifact storage quota cannot block a release). Windows and macOS builds are intentionally
# not produced for now; re-add matrix entries here when they are wanted.

# Gated on CI rather than on the push itself: a red main must not ship. `workflow_run` fires when
# the CI run for a commit finishes, and runs the copy of this file on the default branch, so the
# gate cannot be edited away from a pull request. The commit to release is
# `workflow_run.head_sha` — the one CI actually tested — because a `workflow_run` checkout
# otherwise defaults to whatever the default branch points at now, which may have moved on.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-24.04
    # A manual dispatch releases the default branch as it stands; a CI run only ever releases a
    # successful push to main (pull-request runs and red runs are ignored).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        run: |
          base="$(node -p "require('./package.json').version")"
          mm="${base%.*}"
          n="$(git rev-list --count HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="${mm}.${n}"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Tag $tag already exists; nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $tag"
          fi

  build:
    name: Build (linux)
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      # electron-builder downloads two things the build cannot proceed without: the Electron
      # binary itself, fetched by electron's postinstall into ~/.cache/electron, and the
      # app-builder/AppImage/fpm tooling it pulls into ~/.cache/electron-builder while packaging.
      # Both are keyed on the lockfile, which pins the Electron version, and both are restored
      # before `pnpm install` so even the postinstall fetch is a cache hit. As with the Rust cache
      # below, `main` is what writes the entry pull requests restore.
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Same key as the CI workflow: this job runs on main, so what it saves
          # is what pull requests restore.
          shared-key: native-linux
          workspaces: |
            native/overlay-wlr
            native/rpchatd
      - name: Install system packages (native helper build, clang and libbpf for the IPC guard's BPF program, OpenBLAS for the Qwen voice engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libgtk-layer-shell-dev libwebkit2gtk-4.1-dev pkg-config libopenblas-dev clang libbpf-dev
      - run: pnpm install --frozen-lockfile
      - name: Stamp version
        run: |
          cd apps/desktop
          npm pkg set version="${{ needs.version.outputs.version }}"
      - name: Build
        run: pnpm build
        env:
          RP_REQUIRE_NATIVE: '1'
      - run: pnpm test
      - name: Package
        run: pnpm --filter @rp/desktop exec electron-builder --publish never
      - name: Collect installers and update manifest
        run: |
          mkdir -p dist-out
          find apps/desktop/release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist-out/ \;
          if [ ! -f apps/desktop/release/latest-linux.yml ]; then echo "latest-linux.yml was not produced (check build.publish in apps/desktop/package.json)"; exit 1; fi
          cp apps/desktop/release/latest-linux.yml dist-out/
          cd dist-out
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt
      # The installers go straight from this job to the release: no Actions artifact in between, so
      # the artifact storage quota never blocks a release.
      - name: Create tag and release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: RPChat ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist-out/*
          body: |
            Automated release of `${{ needs.version.outputs.sha }}` from `main`.

            - **Linux**: AppImage or `.deb` (the wlr-layer-shell overlay helper for Hyprland/Sway is bundled; it needs `gtk3`, `gtk-layer-shell` and `webkit2gtk-4.1` runtime libraries).
            - `latest-linux.yml` is the update manifest read by the app's in-place updater (Settings → Updates); leave it attached.
            - Windows and macOS builds are not produced yet.
