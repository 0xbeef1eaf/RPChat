version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node describes a runtime, so it follows the oldest Node anything here runs on:
      # 22, from the root package.json `engines` and the version CI installs. Electron's own
      # Node is newer (24 in 44.x), which is exactly why the floor is what the types have to
      # describe — on a higher major the compiler offers APIs that CI does not have. Move this
      # deliberately, together with `engines` and the CI node-version, not on its own.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # @vitejs/plugin-react 6 is built for Vite 8 (`peerDependencies: vite ^8.0.0`, and new
      # oxc/rolldown peers with it). We are on Vite 7 through electron-vite, and `.npmrc` sets
      # strict-peer-dependencies=false, so the mismatch installs quietly and only shows up as a
      # renderer that no longer renders — the headful smoke caught it, nothing earlier would.
      # Lift this together with the move to Vite 8.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      # playwright-core is pinned exactly (no caret) because it chooses the browser the smoke
      # drives, and the browser is half of what that smoke tests. From 1.63 it downloads Chrome
      # for Testing rather than a Chromium build, and Chrome for Testing reads managed policy
      # from /etc/opt/chrome_for_testing/policies — not the /etc/chromium, /etc/opt/chrome and
      # /etc/opt/edge directories the installer writes. The unpacked phase of browser-smoke.sh
      # still passes on it; the policy phase never sees the extension (#2). Lift this once the
      # smoke has an answer for that — a real Chromium via RP_CHROMIUM_BIN, or a policy path it
      # knows about — and bump it on purpose, not inside a group.
      - dependency-name: playwright-core
      # TypeScript majors are a compiler swap, not a dependency bump. 7 typechecks this repo
      # clean and its `tsc -p` emits byte-identical JavaScript for every package — but it is the
      # native compiler, and packages/sdk/src/generate.test.ts drives the old JS compiler API
      # (`ts.createCompilerHost`, `ts.ScriptTarget`, a virtual-file host) to prove the generated
      # SDK typings compile. That API is not there on 7: `ts.ScriptTarget` is undefined and all
      # six of those tests throw (#4). Moving means giving that test another way to run — a
      # compiler of its own, or the compiler out of process — so it happens on purpose.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Vite majors are gated on electron-vite, which builds and bundles the app: 5.0.0 peers
      # `vite: ^5 || ^6 || ^7`, and the first electron-vite that accepts 8 is 6.0.0-beta.1. With
      # strict peer checks off the build on Vite 8 still succeeds and the app then does not come
      # up at all — the headful smoke gets no main window, no mock action, no overlay (#18).
      # electron-vite itself is deliberately not ignored: its next major is the signal that Vite
      # 8, electron-vite 6 and @vitejs/plugin-react 6 can move, which they have to do together.
      - dependency-name: vite
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /native/overlay-wlr
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # The gtk-rs 0.18 family (gtk/gdk/glib/gio/cairo/pango/webkit2gtk 2.0) must move together;
      # bumping glib alone breaks the build. Update them deliberately as a set.
      - dependency-name: glib
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gio
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gdk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gtk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: cairo-rs
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: pango
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: webkit2gtk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: javascriptcore-rs
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gtk-layer-shell
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
