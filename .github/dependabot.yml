version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node describes a runtime, so it follows the oldest Node anything here runs on:
      # 22, from the root package.json `engines` and the version CI installs. Electron's own
      # Node is newer (24 in 44.x), which is exactly why the floor is what the types have to
      # describe — on a higher major the compiler offers APIs that CI does not have. Move this
      # deliberately, together with `engines` and the CI node-version, not on its own.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # @vitejs/plugin-react 6 is built for Vite 8 (`peerDependencies: vite ^8.0.0`, and new
      # oxc/rolldown peers with it). We are on Vite 7 through electron-vite, and `.npmrc` sets
      # strict-peer-dependencies=false, so the mismatch installs quietly and only shows up as a
      # renderer that no longer renders — the headful smoke caught it, nothing earlier would.
      # Lift this together with the move to Vite 8.
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /native/overlay-wlr
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # The gtk-rs 0.18 family (gtk/gdk/glib/gio/cairo/pango/webkit2gtk 2.0) must move together;
      # bumping glib alone breaks the build. Update them deliberately as a set.
      - dependency-name: glib
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gio
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gdk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gtk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: cairo-rs
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: pango
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: webkit2gtk
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: javascriptcore-rs
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: gtk-layer-shell
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
